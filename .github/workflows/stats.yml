name: Statistiques (tableau de bord)
on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures (à la 17e minute)
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q cryptography
      - name: Statistiques chiffrées
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          STATS_KEY: ${{ secrets.STATS_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/stats.py
      - name: Enregistrer
        run: |
          git config user.name "stats-bot"; git config user.email "actions@users.noreply.github.com"
          git add stats.enc.json
          git diff --cached --quiet && exit 0
          git commit -m "Statistiques du tableau de bord"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
